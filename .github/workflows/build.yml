name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Locate project
        id: p
        run: echo "dir=$(dirname "$(find . -name settings.gradle.kts | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk MediaDownloaderPro.apk
          gh release create "build-${{ github.run_number }}" MediaDownloaderPro.apk \
            --title "MediaDL Pro build ${{ github.run_number }}" \
            --notes "${MSG:-New build}" --latest
